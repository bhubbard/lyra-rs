[package]
name = "lyra-rs"
version = "0.1.0"
edition = "2021"
authors = ["Brandon Hubbard <bkhubbard@gmail.com>", "NVIDIA Spatial Intelligence Lab (Lyra)", "lyra-rs contributors"]
license = "Apache-2.0"
description = "Pure Rust fork and high-performance engine for Project Lyra: Open Generative 3D World Models and Gaussian Splatting"
repository = "https://github.com/bhubbard/lyra-rs"
homepage = "https://github.com/bhubbard/lyra-rs"
readme = "README.md"
keywords = ["3d", "world-models", "gaussian-splatting", "diffusion", "computer-vision"]
categories = ["graphics", "command-line-utilities", "science"]

[lib]
name = "lyra"
path = "src/lib.rs"

[[bin]]
name = "lyra"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "cargo"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
rayon = "1.10"
glam = { version = "0.29", features = ["serde"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
byteorder = "1.5"
indicatif = "0.17"
colored = "3.0"
tokio = { version = "1.43", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["cors", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = "0.8"
base64 = "0.22"

[dev-dependencies]
approx = "0.5"
tempfile = "3.17"
